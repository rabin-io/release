ref:
  as: interop-tests-cnv-shared-step
  documentation: |-
    Run containerized CNV e2e-deploy tests
  from: cnv-ci
  commands: interop-tests-cnv-shared-step-commands.sh
  timeout: 4h0m0s
  credentials:
    - namespace: test-credentials
      name: cluster-secrets-aws-interop-qe
      mount_path: /secrets
    - mount_path: /var/run/cnv-ci-brew-pull-secret
      name: cnv-ci-brew-pull-secret
      namespace: test-credentials
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OCP_VERSION
    default: "4.13"
    documentation: |-
      OpenShift Version
  - name: ARTIFACTS_DIR
    default: /tmp/artifacts
